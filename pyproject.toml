[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceassist"
version = "0.1.0"
description = "Minimal, fully local speech-to-text CLI with wake word, hotkey & KittenTTS voice reply for macOS Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.18.0",
    "openwakeword>=0.6.0",
    "mlx-whisper>=0.4.0",
    "huggingface-hub>=0.20.0",
    "torch>=2.0.0",
    "onnx>=1.16.0",
    "onnxscript>=0.1.0",
    "pynput>=1.8.0",
    "kittentts>=0.1.3",
    "espeakng-loader>=0.2.4",
    "phonemizer>=3.4.0",
    "soundfile>=0.14.0",
    "h5py>=3.10.0",
]

[project.scripts]
transcribe = "transcribe:main"
train-wakeword = "train_wakeword:main"

[tool.setuptools]
py-modules = ["transcribe", "audio", "wakeword", "vad", "speech", "hotkey", "tts", "train_wakeword"]
